name: magictools

services:
  gateway:
    image: ${GATEWAY_IMAGE:-magictools-unconfigured/gateway:unconfigured}
    ports:
      - ${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000
    environment:
      MT_PROD: "1"
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
    restart: unless-stopped

  applicant-web:
    image: ${APPLICANT_WEB_IMAGE:-magictools-unconfigured/applicant-web:unconfigured}
    expose: [ "4008" ]
    restart: unless-stopped
  applicant-server:
    image: ${APPLICANT_SERVER_IMAGE:-magictools-unconfigured/applicant-server:unconfigured}
    expose: [ "5008" ]
    environment:
      PORT: "5008"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/applicant
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gatherer-web:
    image: ${GATHERER_WEB_IMAGE:-magictools-unconfigured/gatherer-web:unconfigured}
    expose: [ "4001" ]
    restart: unless-stopped
  gatherer-server:
    image: ${GATHERER_SERVER_IMAGE:-magictools-unconfigured/gatherer-server:unconfigured}
    expose: [ "5001" ]
    environment:
      PORT: "5001"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gatherer
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  investigator-web:
    image: ${INVESTIGATOR_WEB_IMAGE:-magictools-unconfigured/investigator-web:unconfigured}
    expose: [ "4002" ]
    restart: unless-stopped
  investigator-server:
    image: ${INVESTIGATOR_SERVER_IMAGE:-magictools-unconfigured/investigator-server:unconfigured}
    expose: [ "5002" ]
    environment:
      PORT: "5002"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/investigator
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  assessor-web:
    image: ${ASSESSOR_WEB_IMAGE:-magictools-unconfigured/assessor-web:unconfigured}
    expose: [ "4003" ]
    restart: unless-stopped
  assessor-server:
    image: ${ASSESSOR_SERVER_IMAGE:-magictools-unconfigured/assessor-server:unconfigured}
    expose: [ "5003" ]
    environment:
      PORT: "5003"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/assessor
      INVESTIGATOR_DATABASE_URL: postgres://postgres:postgres@postgres:5432/investigator
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  manager-web:
    image: ${MANAGER_WEB_IMAGE:-magictools-unconfigured/manager-web:unconfigured}
    expose: [ "4004" ]
    restart: unless-stopped
  manager-server:
    image: ${MANAGER_SERVER_IMAGE:-magictools-unconfigured/manager-server:unconfigured}
    expose: [ "5004" ]
    environment:
      PORT: "5004"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/manager
      ASSESSOR_DATABASE_URL: postgres://postgres:postgres@postgres:5432/assessor
      MANAGER_APPROVAL_TOKEN: ${MANAGER_APPROVAL_TOKEN:-}
      MANAGER_APPROVAL_ACTOR: ${MANAGER_APPROVAL_ACTOR:-owner}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  designer-web:
    image: ${DESIGNER_WEB_IMAGE:-magictools-unconfigured/designer-web:unconfigured}
    expose: [ "4005" ]
    restart: unless-stopped
  designer-server:
    image: ${DESIGNER_SERVER_IMAGE:-magictools-unconfigured/designer-server:unconfigured}
    expose: [ "5005" ]
    environment:
      PORT: "5005"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/designer
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scholar-web:
    image: ${SCHOLAR_WEB_IMAGE:-magictools-unconfigured/scholar-web:unconfigured}
    expose: [ "4006" ]
    restart: unless-stopped
  scholar-server:
    image: ${SCHOLAR_SERVER_IMAGE:-magictools-unconfigured/scholar-server:unconfigured}
    expose: [ "5006" ]
    environment:
      PORT: "5006"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scholar
      GATHERER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/gatherer
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  assistant-web:
    image: ${ASSISTANT_WEB_IMAGE:-magictools-unconfigured/assistant-web:unconfigured}
    expose: [ "4007" ]
    restart: unless-stopped
  assistant-server:
    image: ${ASSISTANT_SERVER_IMAGE:-magictools-unconfigured/assistant-server:unconfigured}
    expose: [ "5007" ]
    environment:
      MT_PROD: "1"
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      PORT: "5007"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/assistant
      SCHOLAR_DATABASE_URL: postgres://postgres:postgres@postgres:5432/scholar
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: magictools
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d magictools
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MANAGER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mt_manager_test
      MT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mt_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 检查 0 bug loop 验收记录与文档同步勾选（PR 事件）
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          if echo "$PR_BODY" | grep -qiE '\[x\]\s*\*\*0 bug loop 验收记录\*\*'; then
            echo "✅ 0 bug loop 验收记录已勾选"
          else
            echo "❌ PR 未勾选 0 bug loop 验收记录复选框"
            echo "请在 PR 描述「自检清单」勾选 [x] **0 bug loop 验收记录** 并附验收链接/说明"
            exit 1
          fi
          if echo "$PR_BODY" | grep -qiE '\[x\]\s*\*\*沉淀层文档已同步\*\*'; then
            echo "✅ 沉淀层文档同步（CHANGELOG/CODE_WIKI）已勾选"
          else
            echo "❌ PR 未勾选「沉淀层文档已同步」复选框"
            echo "请在「自检清单」勾选 [x] **沉淀层文档已同步**：追加 docs/CHANGELOG.md 条目并核对 CODE_WIKI.md 涉及章节"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: 缓存 turbo 构建
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:gate
      - name: 保存候选提交的质量证据（失败也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建17镜像并验证独立Compose冷启动
        run: pnpm images:smoke
      - name: 保存镜像与运行证据（失败也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qa/images/
            .qa/runtime/
            .qa/releases/
            .qa/deployment-validation/**/summary.json
            .qa/deployment-validation/**/receipt.json
            .qa/deployment-validation/**/state.json
            .qa/deployment-validation/*/first-config.json
            .qa/deployment-validation/*/second-config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: smoke
    # 钉 ubuntu-24.04：与 visual-baseline.yml 同口径，避免 latest 滚动镜像造成像素比对假阳性
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applicant
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: "5008"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/applicant
      MT_LLM_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # D-18 前置：安装 CJK 字体。注意：字体只保证 linux 渲染与 win32 一致，
      # 基线文件仍需专门 workflow 生成入库；当前 CI 视觉用例由 _visual.spec.ts 守卫显式 skip。
      - name: 安装 CJK 字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
      - name: 缓存 turbo 构建
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @mt/e2e exec playwright install chromium
      - name: 生成一次性 Manager 审批测试凭证
        run: |
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "MANAGER_APPROVAL_TOKEN=" + require("node:crypto").randomBytes(32).toString("hex") + "\nMANAGER_APPROVAL_ACTOR=e2e-owner\n")'
      - name: 启动全部服务并运行 E2E
        run: |
          node apps/applicant/server/dist/main.js &
          (cd apps/applicant/web && node node_modules/vite/bin/vite.js preview --port 4008 --strictPort --host 127.0.0.1) &
          node apps/gateway/dist/index.js &
          PORT=5002 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/investigator FEISHU_STUB=1 MT_LLM_STUB=1 node apps/investigator/server/dist/main.js &
          (cd apps/investigator/web && node node_modules/vite/bin/vite.js preview --port 4002 --strictPort --host 127.0.0.1) &
          PORT=5003 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assessor INVESTIGATOR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/investigator MT_LLM_STUB=1 GITHUB_STUB=1 node apps/assessor/server/dist/main.js &
          (cd apps/assessor/web && node node_modules/vite/bin/vite.js preview --port 4003 --strictPort --host 127.0.0.1) &
          PORT=5004 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/manager ASSESSOR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assessor GITHUB_STUB=1 node apps/manager/server/dist/main.js &
          (cd apps/manager/web && node node_modules/vite/bin/vite.js preview --port 4004 --strictPort --host 127.0.0.1) &
          PORT=5001 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gatherer FEED_STUB=1 MT_LLM_STUB=1 node apps/gatherer/server/dist/main.js &
          (cd apps/gatherer/web && node node_modules/vite/bin/vite.js preview --port 4001 --strictPort --host 127.0.0.1) &
          PORT=5006 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/scholar GATHERER_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gatherer MT_LLM_STUB=1 node apps/scholar/server/dist/main.js &
          (cd apps/scholar/web && node node_modules/vite/bin/vite.js preview --port 4006 --strictPort --host 127.0.0.1) &
          PORT=5007 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assistant SCHOLAR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/scholar MT_LLM_STUB=1 CYBERCLOUD_STUB=1 ACTION_STUB=1 CLARIFY_STUB_CONFIDENCE=0.9 node apps/assistant/server/dist/main.js &
          (cd apps/assistant/web && node node_modules/vite/bin/vite.js preview --port 4007 --strictPort --host 127.0.0.1) &
          PORT=5005 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/designer MT_LLM_STUB=1 node apps/designer/server/dist/main.js &
          (cd apps/designer/web && node node_modules/vite/bin/vite.js preview --port 4005 --strictPort --host 127.0.0.1) &
          # 服务就绪探测替代固定 sleep：17 个进程启动有先后（vite preview / Nest migration），
          # 固定 10s 在 CI 慢启动机器上会让首批用例撞上半就绪服务（responsive 巡检锚点最敏感）。
          for i in $(seq 1 30); do
            ok=0
            curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1 && ok=$((ok+1))
            curl -sf http://127.0.0.1:4001/sources/ >/dev/null 2>&1 && ok=$((ok+1))
            curl -sf http://127.0.0.1:4008/positions/ >/dev/null 2>&1 && ok=$((ok+1))
            if [ "$ok" -ge 3 ]; then echo "all services ready (${i}0s)"; break; fi
            sleep 10
          done
          curl -sf http://127.0.0.1:3000/health || (echo "gateway not ready after 300s"; exit 1)
          # 视觉快照须在「空库态」单独跑（与基线生成 workflow 同口径）：
          # 并发 spec 会与视觉用例同时写库，页面数据行数漂移导致像素比对必失败
          pnpm --filter @mt/e2e exec playwright test _visual.spec.ts
          # 其余功能用例并发跑（会写库，但不影响已完成的视觉比对）
          pnpm --filter @mt/e2e exec playwright test --grep-invert "视觉快照"

  images:
    if: github.ref == 'refs/heads/main'
    needs: [quality, smoke, e2e]
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: 未配置镜像仓库时记录未发布
        if: env.REGISTRY_HOST == ''
        run: echo '未配置 REGISTRY_HOST，本轮未发布镜像。' >> "$GITHUB_STEP_SUMMARY"
      - if: env.REGISTRY_HOST != ''
        uses: pnpm/action-setup@v4
      - if: env.REGISTRY_HOST != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - if: env.REGISTRY_HOST != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - if: env.REGISTRY_HOST != ''
        run: pnpm install --frozen-lockfile
      - name: 发布源码SHA标签与固定digest清单
        if: env.REGISTRY_HOST != ''
        run: pnpm images:release --registry "$REGISTRY_HOST/magictools"
      - name: 保存发布制品与失败回执
        if: always() && env.REGISTRY_HOST != ''
        uses: actions/upload-artifact@v4
        with:
          name: image-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qa/images/
            .qa/releases/
            .qa/runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

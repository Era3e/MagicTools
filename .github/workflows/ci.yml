name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mt_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:infra
      - run: pnpm docs:lint

  smoke:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applicant
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: "5008"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/applicant
      MT_LLM_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@mt/applicant-server
      - run: pnpm exec turbo run build --filter=@mt/applicant-web
      - run: pnpm exec turbo run build --filter=@mt/gateway
      - run: pnpm exec turbo run build --filter=@mt/investigator-server
      - run: pnpm exec turbo run build --filter=@mt/investigator-web
      - run: pnpm exec turbo run build --filter=@mt/assessor-server
      - run: pnpm exec turbo run build --filter=@mt/assessor-web
      - run: pnpm exec turbo run build --filter=@mt/manager-server
      - run: pnpm exec turbo run build --filter=@mt/manager-web
      - run: pnpm exec turbo run build --filter=@mt/gatherer-server
      - run: pnpm exec turbo run build --filter=@mt/gatherer-web
      - run: pnpm exec turbo run build --filter=@mt/scholar-server
      - run: pnpm exec turbo run build --filter=@mt/scholar-web
      - run: pnpm exec turbo run build --filter=@mt/assistant-server
      - run: pnpm exec turbo run build --filter=@mt/assistant-web
      - run: pnpm exec turbo run build --filter=@mt/designer-server
      - run: pnpm exec turbo run build --filter=@mt/designer-web
      - name: 启动全部服务并冒烟
        run: |
          node apps/applicant/server/dist/main.js &
          (cd apps/applicant/web && node node_modules/vite/bin/vite.js preview --port 4008 --strictPort --host 127.0.0.1) &
          node apps/gateway/dist/index.js &
          PORT=5002 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/investigator FEISHU_STUB=1 MT_LLM_STUB=1 node apps/investigator/server/dist/main.js &
          (cd apps/investigator/web && node node_modules/vite/bin/vite.js preview --port 4002 --strictPort --host 127.0.0.1) &
          PORT=5003 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assessor INVESTIGATOR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/investigator MT_LLM_STUB=1 GITHUB_STUB=1 node apps/assessor/server/dist/main.js &
          (cd apps/assessor/web && node node_modules/vite/bin/vite.js preview --port 4003 --strictPort --host 127.0.0.1) &
          PORT=5004 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/manager ASSESSOR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assessor GITHUB_STUB=1 node apps/manager/server/dist/main.js &
          (cd apps/manager/web && node node_modules/vite/bin/vite.js preview --port 4004 --strictPort --host 127.0.0.1) &
          PORT=5001 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gatherer FEED_STUB=1 MT_LLM_STUB=1 node apps/gatherer/server/dist/main.js &
          (cd apps/gatherer/web && node node_modules/vite/bin/vite.js preview --port 4001 --strictPort --host 127.0.0.1) &
          PORT=5006 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/scholar GATHERER_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gatherer MT_LLM_STUB=1 node apps/scholar/server/dist/main.js &
          (cd apps/scholar/web && node node_modules/vite/bin/vite.js preview --port 4006 --strictPort --host 127.0.0.1) &
          PORT=5007 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assistant SCHOLAR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/scholar MT_LLM_STUB=1 CYBERCLOUD_STUB=1 node apps/assistant/server/dist/main.js &
          (cd apps/assistant/web && node node_modules/vite/bin/vite.js preview --port 4007 --strictPort --host 127.0.0.1) &
          PORT=5005 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/designer MT_LLM_STUB=1 node apps/designer/server/dist/main.js &
          (cd apps/designer/web && node node_modules/vite/bin/vite.js preview --port 4005 --strictPort --host 127.0.0.1) &
          sleep 10
          node infra/scripts/smoke.mjs --only applicant
          node infra/scripts/smoke.mjs --only investigator
          node infra/scripts/smoke.mjs --only assessor
          node infra/scripts/smoke.mjs --only manager
          node infra/scripts/smoke.mjs --only gatherer
          node infra/scripts/smoke.mjs --only scholar
          node infra/scripts/smoke.mjs --only assistant
          node infra/scripts/smoke.mjs --only designer

  e2e:
    needs: smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applicant
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: "5008"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/applicant
      MT_LLM_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@mt/applicant-server
      - run: pnpm exec turbo run build --filter=@mt/applicant-web
      - run: pnpm exec turbo run build --filter=@mt/gateway
      - run: pnpm exec turbo run build --filter=@mt/investigator-server
      - run: pnpm exec turbo run build --filter=@mt/investigator-web
      - run: pnpm exec turbo run build --filter=@mt/assessor-server
      - run: pnpm exec turbo run build --filter=@mt/assessor-web
      - run: pnpm exec turbo run build --filter=@mt/manager-server
      - run: pnpm exec turbo run build --filter=@mt/manager-web
      - run: pnpm exec turbo run build --filter=@mt/gatherer-server
      - run: pnpm exec turbo run build --filter=@mt/gatherer-web
      - run: pnpm exec turbo run build --filter=@mt/scholar-server
      - run: pnpm exec turbo run build --filter=@mt/scholar-web
      - run: pnpm exec turbo run build --filter=@mt/assistant-server
      - run: pnpm exec turbo run build --filter=@mt/assistant-web
      - run: pnpm exec turbo run build --filter=@mt/designer-server
      - run: pnpm exec turbo run build --filter=@mt/designer-web
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @mt/e2e exec playwright install chromium
      - name: 启动全部服务并运行 E2E
        run: |
          node apps/applicant/server/dist/main.js &
          (cd apps/applicant/web && node node_modules/vite/bin/vite.js preview --port 4008 --strictPort --host 127.0.0.1) &
          node apps/gateway/dist/index.js &
          PORT=5002 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/investigator FEISHU_STUB=1 MT_LLM_STUB=1 node apps/investigator/server/dist/main.js &
          (cd apps/investigator/web && node node_modules/vite/bin/vite.js preview --port 4002 --strictPort --host 127.0.0.1) &
          PORT=5003 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assessor INVESTIGATOR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/investigator MT_LLM_STUB=1 GITHUB_STUB=1 node apps/assessor/server/dist/main.js &
          (cd apps/assessor/web && node node_modules/vite/bin/vite.js preview --port 4003 --strictPort --host 127.0.0.1) &
          PORT=5004 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/manager ASSESSOR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assessor GITHUB_STUB=1 node apps/manager/server/dist/main.js &
          (cd apps/manager/web && node node_modules/vite/bin/vite.js preview --port 4004 --strictPort --host 127.0.0.1) &
          PORT=5001 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gatherer FEED_STUB=1 MT_LLM_STUB=1 node apps/gatherer/server/dist/main.js &
          (cd apps/gatherer/web && node node_modules/vite/bin/vite.js preview --port 4001 --strictPort --host 127.0.0.1) &
          PORT=5006 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/scholar GATHERER_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/gatherer MT_LLM_STUB=1 node apps/scholar/server/dist/main.js &
          (cd apps/scholar/web && node node_modules/vite/bin/vite.js preview --port 4006 --strictPort --host 127.0.0.1) &
          PORT=5007 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/assistant SCHOLAR_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/scholar MT_LLM_STUB=1 CYBERCLOUD_STUB=1 node apps/assistant/server/dist/main.js &
          (cd apps/assistant/web && node node_modules/vite/bin/vite.js preview --port 4007 --strictPort --host 127.0.0.1) &
          PORT=5005 DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/designer MT_LLM_STUB=1 node apps/designer/server/dist/main.js &
          (cd apps/designer/web && node node_modules/vite/bin/vite.js preview --port 4005 --strictPort --host 127.0.0.1) &
          sleep 10
          pnpm --filter @mt/e2e exec playwright test

  images:
    if: github.ref == 'refs/heads/main'
    needs: [quality, smoke, e2e]
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
    strategy:
      matrix:
        service:
          - gateway
          - applicant-web
          - applicant-server
          - gatherer-web
          - gatherer-server
          - investigator-web
          - investigator-server
          - assessor-web
          - assessor-server
          - manager-web
          - manager-server
          - designer-web
          - designer-server
          - scholar-web
          - scholar-server
          - assistant-web
          - assistant-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.REGISTRY_HOST != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: 构建并推送镜像
        if: env.REGISTRY_HOST != ''
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_PREFIX: ${{ env.REGISTRY_HOST }}/magictools
        shell: bash
        run: |
          set -e
          case "$SERVICE" in
            gateway)
              docker build -f apps/gateway/Dockerfile -t "$IMAGE_PREFIX/gateway:latest" .
              ;;
            *-web)
              app="${SERVICE%%-web}"
              docker build -f "apps/$app/web/Dockerfile" -t "$IMAGE_PREFIX/$SERVICE:latest" .
              ;;
            *-server)
              app="${SERVICE%%-server}"
              docker build -f "apps/$app/server/Dockerfile" -t "$IMAGE_PREFIX/$SERVICE:latest" .
              ;;
          esac
          docker push "$IMAGE_PREFIX/$SERVICE:latest"
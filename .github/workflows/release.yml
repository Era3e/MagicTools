name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 检查待消费 changesets
        id: changesets
        run: |
          # Private 包的 changeset 会被 Changesets 忽略；只有实际计划 bump 的包才需要 Version PR。
          if pnpm exec changeset status --verbose | grep -q -- '- @mt/'; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: changesets/action@v1
        if: steps.changesets.outputs.has == 'true'
        with:
          version: pnpm release
          # publish 是 changesets/action 的分叉开关：无待消费 changeset 时不再尝试
          # 开 Version PR（否则撞 422 No commits），改为执行 publish 脚本——私有
          # monorepo 不发 npm，用 changeset tag 仅打 git tag
          publish: pnpm release:tag
          commit: "chore(release): 发布新版本并更新迭代日志"
          title: "chore(release): 迭代日志与版本更新"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送版本 tag
        if: steps.changesets.outputs.has == 'false'
        run: |
          git fetch origin --tags --force
          before="${RUNNER_TEMP:-/tmp}/magictools-tags-before"
          after="${RUNNER_TEMP:-/tmp}/magictools-tags-after"
          git tag --list | sort > "$before"
          pnpm release:tag
          git tag --list | sort > "$after"
          new_tags="$(comm -13 "$before" "$after")"
          if [ -n "$new_tags" ]; then
            printf '%s\n' "$new_tags" | xargs git push origin
          else
            echo "No new version tags to push"
          fi

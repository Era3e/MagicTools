:root{--uikit-sidebar-w:208px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--background);color:var(--fg);font-family:var(--font-body);font-size:var(--font-size-body);line-height:var(--line-height-body);transition:background var(--duration-base) var(--ease-standard)}
#root{min-height:100vh}
/* ── layout guard skeleton ── */
.uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:var(--uikit-sidebar-w,220px) minmax(0,1fr);gap:0;min-height:100vh}
.uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
.uikit-sidebar{overflow:hidden;max-width:100%}
[data-component]{min-width:0;max-width:100%;overflow:hidden}
.uikit-toolbar{display:flex;align-items:center;gap:var(--space-2)}
.uikit-responsive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);min-width:0}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.uikit-table-wrap .tbl{min-width:720px}
.uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-nowrap{white-space:nowrap;flex-shrink:0}

.uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.topbar{display:flex;align-items:center;gap:var(--space-2);height:52px;padding:0 var(--space-4);background:var(--mt-graphite-900);border-bottom:1px solid var(--mt-graphite-700);flex-shrink:0}
.topbar-brand{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:var(--font-size-eyebrow);font-weight:var(--font-weight-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mt-graphite-300)}
.topbar-crumb{font-size:var(--font-size-caption);color:var(--mt-graphite-300)}
.topbar-spacer{flex:1}
.tb-sep{width:1px;height:20px;background:var(--mt-graphite-700);flex-shrink:0}

.i16{width:16px;height:16px}.i20{width:20px;height:20px}.i40{width:40px;height:40px}

.ckbtn{padding:0;background:transparent;cursor:pointer;flex-shrink:0}
/* ── 主内容 ── */
.uikit-main{flex:1;display:flex;flex-direction:column;gap:var(--space-5);padding:var(--space-6) var(--space-5)}
.view{display:flex;flex-direction:column;gap:var(--space-5);min-width:0;animation:viewIn var(--duration-slow) var(--ease-entrance)}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.page-eyebrow{color:var(--text-muted)}
.page-title-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;min-width:0}
.page-title{margin:0;color:var(--text-strong);word-break:keep-all;overflow-wrap:break-word}
.page-sub{margin:0}

.kpi-cell{display:flex;flex-direction:column;gap:var(--space-1);padding-left:var(--space-4);min-width:0;border-left:1px solid var(--rule)}
.kpi-cell:first-child{border-left:none;padding-left:0}
.kpi-label{font-size:var(--font-size-caption);color:var(--text-muted)}
.kpi-value{font-family:var(--font-mono);font-weight:var(--font-weight-mono);font-size:var(--font-size-h2);line-height:1.2;color:var(--text-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-unit{font-size:var(--font-size-caption);font-weight:400;color:var(--text-muted)}
.kpi-delta{font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}
.kpi-up{color:var(--color-success)}
/* 图表 */
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);min-width:0}
.card-head h3{margin:0;color:var(--text-strong)}
.card-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;text-align:right}
.plot{position:relative;display:flex;align-items:flex-end;gap:6px;height:150px;margin:var(--space-4) 0 var(--space-2);border-bottom:1px solid var(--rule)}
.gl{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--rule);pointer-events:none}
.bar{position:relative;z-index:1;flex:1;min-width:0;background:var(--primary);border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:opacity var(--duration-fast) var(--ease-standard)}

.bar.today{background:var(--accent)}

.xlabels{display:flex;gap:6px;min-width:0}
.xl{flex:1;min-width:0;text-align:center;font-family:var(--font-mono);font-size:var(--font-size-eyebrow);color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-today{font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--accent);white-space:nowrap}

.irow{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-2) 0;border-bottom:1px solid var(--rule)}
.irow:last-of-type{border-bottom:none}
.irow-top{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.irow-tag{flex:1;min-width:0}
.irow-num{margin-left:auto;font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--text-muted);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.ptrack{height:4px;background:var(--surface-2);border-radius:var(--radius-full);overflow:hidden}
.pfill{height:100%;background:var(--primary);border-radius:var(--radius-full)}
.p46{width:46%}.p32{width:32%}.p12{width:12%}.p7{width:7%}
.card-foot{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-4);flex-wrap:wrap;min-width:0}
.card-foot-note{margin-left:auto;font-size:var(--font-size-caption);color:var(--text-faint)}
/* 规格 rail / 表单 */
.rail-label{margin:var(--space-4) 0 var(--space-2);font-size:var(--font-size-caption);font-weight:600;color:var(--text-muted)}
.rail-label:first-child{margin-top:0}
.rail{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);min-width:0}
.field-hint{font-size:var(--font-size-caption);color:var(--text-faint)}
.ovl-fields{display:flex;flex-direction:column;gap:var(--space-2)}
/* 表格页 */
.src-search{flex:0 1 220px;min-width:140px}
.tb-right{display:flex;align-items:center;gap:var(--space-2);margin-left:auto;flex-shrink:0}
.type-cell{color:var(--text-muted);font-size:var(--font-size-caption)}
.ta-r{text-align:right}
.tbl-empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-7) var(--space-4);text-align:center}
.empty-title{margin:0;font-family:var(--font-display);font-style:italic;font-size:var(--font-size-h4);color:var(--text-muted)}
.empty-ico{color:var(--mt-graphite-300)}
/* 前台门面 */
.front-note{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;min-width:0}
.front-note p{margin:0}
.search-wrap{flex:1;min-width:200px;max-width:420px}
.masthead-count{color:var(--text-muted)}
.filter-on{border-color:var(--primary);color:var(--primary)}
.job-tags{display:flex;align-items:center;gap:var(--space-1);margin-top:var(--space-2)}
.front-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;min-width:0}
.front-foot p{margin:0}
.front-ver{color:var(--text-faint)}
/* 响应式 */
@media (max-width:900px){
.uikit-shell{grid-template-columns:minmax(0,1fr)}
.uikit-responsive-grid,.form-grid{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi-cell:nth-child(odd){border-left:none;padding-left:0}
.uikit-sidebar .mt-sider{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
.mt-sider-back{margin-top:0;margin-left:auto}
}
@media (max-width:640px){
.uikit-toolbar{flex-direction:column;align-items:stretch}
.uikit-responsive-grid,.g3,.form-grid{grid-template-columns:minmax(0,1fr)}
.tb-right{margin-left:0;flex-wrap:wrap}
.toolbar{flex-wrap:wrap}
.topbar{flex-wrap:wrap;height:auto;padding:var(--space-2) var(--space-3)}
.search-wrap{max-width:none}
}
@media (prefers-reduced-motion:reduce){
body,.bar,.topbar-btn,.view{transition-duration:0.01ms;animation-duration:0.01ms}
}
</style>

    <p className="mt-mono front-ver uikit-truncate">v0.9.2 · 墨蓝石墨</p>
   </div>
  </div>
 );
}

function App(){

 useEffect(function(){
  document.documentElement.classList.toggle('dark',dark);

 },[dark,view,sw]);
 const crumb={overview:'总览驾驶舱 · FLIGHT DECK',sources:'采集源管理',gallery:'组件画廊 · 委托生成',front:'前台门面 · 岗位博览',jobs:'岗位博览 · 后台编目',scholar:'知识书院 · 编目台',invest:'调研档案馆 · 卷宗管理',intents:'意图日志 · 路由评估'}[view];
 const NAV=[
  {k:'overview',l:'总览驾驶舱'},
  {k:'jobs',l:'岗位博览',c:'12'},
  {k:'scholar',l:'知识书院'},
  {k:'invest',l:'调研档案馆'},
  {k:'sources',l:'采集源管理'},
  {k:'gallery',l:'组件画廊'},
  {k:'intents',l:'意图日志',c:'47'}
 ];
 const WIRED=['overview','sources','gallery','jobs','scholar','invest','intents'];
 return (
  <div className="uikit-shell" data-layout-guard="uikit-v1" style={{'--uikit-sidebar-w':'208px'}}>
   <aside className="uikit-sidebar">
    <nav className="mt-sider" data-component="shell-nav">
     <div className="mt-sider-brand uikit-truncate">MAGICTOOLS · ADMIN</div>

      <a key={it.k} href="#" className={'mt-sider-item'+(view===it.k?' is-active':'')} onClick={function(e){e.preventDefault();if(wired){setView(it.k);}}}>
       <span className="uikit-truncate sider-label">{it.l}</span>
       {it.c?<span className="st st-count">{it.c}</span>:null}
      </a>);})}
     <a className="mt-sider-item mt-sider-back" href="#" onClick={function(e){e.preventDefault();setView('front');}}>
      <i data-lucide="arrow-left" className="i16 ico-gap" aria-hidden="true"></i>
      <span className="uikit-truncate sider-label">返回前台</span>
     </a>
    </nav>
   </aside>
   <div className="uikit-right">
    <header className="topbar">
     <span className="topbar-brand uikit-nowrap">MT · ADMIN CONSOLE</span>
     <span className="tb-sep"></span>
     <span className="topbar-crumb uikit-truncate">{crumb}</span>
     <span className="topbar-spacer"></span>
     <button className="topbar-btn" onClick={function(){setSw(!sw);}} aria-expanded={sw}>
      <span className="uikit-truncate">切换应用</span><i data-lucide="chevron-down" className="i16" aria-hidden="true"></i>
     </button>
     <span className="tb-sep"></span>
     <button className="topbar-btn" aria-label="通知"><i data-lucide="bell" className="i16" aria-hidden="true"></i></button>
     <button className="topbar-btn" onClick={function(){setDark(!dark);}} aria-label="切换亮色或暗色主题">{dark?'切换亮色':'切换暗色'}<i data-lucide={dark?'sun':'moon'} className="i16" aria-hidden="true"></i></button>
     <span className="tb-sep"></span>
     <span className="topbar-user uikit-nowrap"><i data-lucide="user" className="i20" aria-hidden="true"></i>墨工 · 超级管理员</span>
    </header>
    {sw?(
     <div className="mt-switcher-menu switchstrip" data-component="shell-nav">
      {APPS.map(function(a){return (
       <a key={a} href="#" className="mt-switcher-item" onClick={function(e){e.preventDefault();setSw(false);if(APP_GO[a]){setView(APP_GO[a]);}}}><span className="uikit-truncate">{a}</span></a>);})}
     </div>
    ):null}
    <main className="uikit-main">
     {view==='overview'?<Overview/>:null}
     {view==='sources'?<Sources/>:null}
     {view==='gallery'?<Gallery/>:null}
     {view==='jobs'?<Jobs/>:null}
     {view==='scholar'?<Scholar/>:null}
     {view==='invest'?<Invest/>:null}
     {view==='intents'?<Intents/>:null}
     {view==='front'?<Front go={setView}/>:null}
    </main>
   </div>
  </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>try{lucide.createIcons();}catch(e){}</script>

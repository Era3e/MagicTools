<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MtStatusTag 状态标签</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--color-surface); font-family:var(--font-body); color:var(--color-text); font-size:var(--font-size-body); }
.row { display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-2); flex-wrap:wrap; }
.label { width:92px; flex-shrink:0; font-size:var(--font-size-caption); color:var(--color-text-muted); }
.rail { display:inline-flex; align-items:center; gap:var(--space-1); flex-wrap:wrap; }
.divider { border:0; border-top:1px solid var(--color-border); margin:var(--space-3) 0; }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.st { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-1); height:22px; min-width:22px; padding:0 var(--space-2); border-radius:var(--radius-sm); font-size:var(--font-size-caption); font-weight:500; line-height:1; white-space:nowrap; flex-shrink:0; }
.st-dot { width:6px; height:6px; border-radius:var(--radius-full); background:currentColor; flex-shrink:0; }
.st-info { background:var(--mt-info-50); color:var(--mt-info-700); }
.st-accent { background:var(--mt-amber-50); color:var(--mt-amber-700); }
.st-success { background:var(--mt-success-50); color:var(--mt-success-700); }
.st-error { background:var(--mt-error-50); color:var(--mt-error-700); }
.st-intent { font-family:var(--font-mono); font-size:var(--font-size-eyebrow); background:var(--mt-ink-50); color:var(--mt-ink-700); border:1px solid var(--mt-ink-100); }
.st-solid { background:var(--mt-ink-600); color:var(--primary-foreground); }
.st-count { font-family:var(--font-mono); font-weight:var(--font-weight-mono); background:var(--mt-graphite-100); color:var(--mt-graphite-700); min-width:24px; padding:0 var(--space-1); text-align:center; }
.st-click { cursor:pointer; transition:background .15s var(--ease-standard); }
.st-click:hover { background:var(--mt-info-100); }
.dark .st-info { background:var(--mt-info-800); color:var(--mt-info-200); }
.dark .st-accent { background:var(--mt-amber-800); color:var(--mt-amber-200); }
.dark .st-success { background:var(--mt-success-800); color:var(--mt-success-200); }
.dark .st-error { background:var(--mt-error-800); color:var(--mt-error-200); }
.dark .st-intent { background:var(--mt-ink-800); color:var(--mt-ink-200); border-color:var(--mt-ink-700); }
.dark .st-count { background:var(--mt-graphite-800); color:var(--mt-graphite-200); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">软语义</span><span class="rail" data-evidence-sample="Soft semantic tags"><span class="st st-accent"><span class="st-dot"></span>招募中</span><span class="st st-info">进行中</span><span class="st st-success">已完成</span><span class="st st-error">已失败</span></span></div>
<div class="row"><span class="label">意图标识</span><span class="rail" data-evidence-sample="Intent tag"><span class="st st-intent">data_query · 数据查询</span></span></div>
<hr class="divider">
<div class="row"><span class="label">高强调</span><span class="rail" data-evidence-sample="Solid high-emphasis"><span class="st st-solid">DOING</span></span></div>
<div class="row"><span class="label">可点击</span><span class="rail" data-evidence-sample="Soft semantic tags"><span class="st st-info st-click">进行中</span></span></div>
<div class="row"><span class="label">列头计数</span><span class="rail" data-evidence-sample="Priority counter"><span class="st st-count">12</span></span></div>
</body>
</html>
